name: Inventory old sermon audio

on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: Shared Drive holding the "20xx Audio" folders
        required: true
        default: 0AH3ka1ADYmHpUk9PVA

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      indexes: ${{ steps.list.outputs.indexes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: list
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          DRIVE_ID: ${{ inputs.drive_id }}
        # Only plain numbers go in the job output: GitHub blanks outputs that contain any line of a secret
        # (a pretty-printed key file has lines like "{"), so the folder list travels as an artifact.
        run: |
          (cd worker && python inventory.py plan "$DRIVE_ID") > folders.json
          cat folders.json
          echo "indexes=$(python -c 'import json;print(json.dumps(list(range(len(json.load(open("folders.json")))))))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: folders
          path: folders.json

  folder:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.plan.outputs.indexes) }}
    name: folder ${{ matrix.index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: folders
      - env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          DRIVE_ID: ${{ inputs.drive_id }}
          INDEX: ${{ matrix.index }}
        run: |
          mkdir -p results
          FOLDER_ID=$(python -c "import json,os;print(json.load(open('folders.json'))[int(os.environ['INDEX'])]['id'])")
          cd worker && python inventory.py folder "$DRIVE_ID" "$FOLDER_ID" "../results/inv-$INDEX.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: inv-${{ matrix.index }}
          path: results/

  merge:
    needs: folder
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: inv-*
          merge-multiple: true
          path: results
      - run: |
          cd worker && python inventory.py merge ../results ../inventory
          { echo '```'; cat ../inventory/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: inventory/
